[project]
name = "yt-dlp-youtube-models"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "qwrwed", email = "qwrwed@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mypy>=2.3.1",
    "pydantic>=2.13.5",
    "types-yt-dlp>=2026.8.19.20260912",
    "yt-dlp==2026.8.19",
]

[project.scripts]
yt-dlp-youtube-models = "yt_dlp_youtube_models:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "types-yt-dlp>=2026.8.19.20260912",
]
