[project]
name = "ytdlp-models"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "qwrwed", email = "qwrwed@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
ytdlp-models = "ytdlp_models:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.8",
    "types-yt-dlp>=2026.8.19.20260912",
    "yt-dlp>=2026.8.19",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
addopts = "-m 'not network'"
markers = ["network: extracts from YouTube with yt-dlp"]
# spec-style names: classes state the subject, methods state the rule
python_classes = ["A_*", "An_*"]
python_functions = ["*"]

[tool.mypy]
strict = true

[tool.uv]
# re-resolve yt-dlp to its newest release on every uv run/sync/lock
upgrade-package = ["yt-dlp"]
